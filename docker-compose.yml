services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Decoder açıksa (GA_DECODER=ollama) uygulama aşağıdaki ollama servisine bağlanır.
      GA_DECODER_URL: http://ollama:11434
    volumes:
      - ga-data:/data
    restart: unless-stopped

  # Yerel decoder (isteğe bağlı). İlk kurulumda modeli indirin:
  #   docker compose exec ollama ollama pull qwen2.5:3b
  ollama:
    image: ollama/ollama
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

volumes:
  ga-data:
  ollama-models:
